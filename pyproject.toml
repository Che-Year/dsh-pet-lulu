[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-pet-lulu"
version = "0.1.1"
description = "A cute capybara desktop pet for DeepSeek Harness (dsh) — terminal ANSI or Tk window mode."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT (code); see dsh_pet/assets/SOURCES.md for bundled artwork licenses" }
authors = [{ name = "dsh-pet-lulu contributors" }]
keywords = ["dsh", "pet", "capybara", "terminal", "tui", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
# Pillow is technically optional (the pet falls back to a built-in ASCII
# sprite pack without it), so it is declared as the "sprites" extra.
dependencies = []

[project.optional-dependencies]
sprites = ["Pillow>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
dsh-pet = "dsh_pet.main:main"

[tool.setuptools]
packages = ["dsh_pet"]

[tool.setuptools.package-data]
dsh_pet = [
    "assets/**/*.webp",
    "assets/**/*.json",
    "assets/**/*.png",
    "assets/**/LICENSE*",
    "assets/**/NOTICE*",
    "assets/**/SOURCES.md",
]
